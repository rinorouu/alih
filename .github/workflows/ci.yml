name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test POSIX installer
        shell: sh
        run: |
          set -eu
          sh -n install.sh
          sh -n scripts/test-install.sh
          sh scripts/test-install.sh

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: linux-amd64
          - runner: windows-2025
            name: windows-amd64
          - runner: macos-15
            name: darwin-arm64
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "install.ps1 contains PowerShell syntax errors."
          }

      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Configure UCRT64 compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          $cc = Join-Path $bin "gcc.exe"
          if (-not (Test-Path $cc)) {
            throw "MSYS2 UCRT64 GCC was not installed at the expected location."
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/alih
